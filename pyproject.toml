[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "domaine-analyser"
version = "0.1.0"
description = "Audit de sécurité email et forensic d'usurpation : DNS, SPF, DKIM, DMARC, rapports RUA et profilage d'expéditeur"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DomaineAnalyser contributors" }]
keywords = [
    "dmarc", "spf", "dkim", "dns", "email-security",
    "spoofing", "phishing", "forensics", "osint", "whois", "rdap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "dnspython>=2.6",
    "pyspf>=2.0.14",
    "dkimpy>=1.1.5",
    "authheaders>=0.16",
    "cryptography>=42.0",
    "httpx>=0.27",
    "tldextract>=5.1",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "platformdirs>=4.2",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.urls]
Homepage = "https://github.com/OWNER/DomaineAnalyser"
Issues = "https://github.com/OWNER/DomaineAnalyser/issues"

[project.scripts]
domaine-analyser = "domaine_analyser.cli:main"
da = "domaine_analyser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/domaine_analyser"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "RET", "ARG"]
ignore = [
    "E501",    # géré par le formateur
    "RUF001",  # les libellés utilisateur sont en français, apostrophes typographiques assumées
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802"]
# Typer déclare les options via des appels dans les valeurs par défaut : c'est
# la forme documentée de la bibliothèque, pas une closure accidentelle.
"src/domaine_analyser/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src/domaine_analyser"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Ces paquets n'exposent pas de stubs typés.
[[tool.mypy.overrides]]
module = ["spf.*", "dkim.*", "authheaders.*", "tldextract.*", "bs4.*", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test nécessitant un accès réseau réel (désactivé par défaut)",
]
