# Base de reconnaissance des services rattachés à un domaine.
#
# La détection croise quatre signaux indépendants. Le plus révélateur est le
# dernier : un jeton de vérification TXT survit très souvent au service qu'il
# autorisait. Il trahit alors un accès resté ouvert, oublié depuis des années.
#
#   mx            suffixe d'un hôte MX
#   spf_includes  cible d'un mécanisme include: / redirect=
#   dkim_prefix   préfixe de sélecteur DKIM publié
#   txt_tokens    préfixe d'un jeton de vérification dans un TXT du domaine
#
# Champs :
#   kind                 mailbox | esp | gateway | dns | other
#   can_send_as_domain   le service peut émettre en affichant ce domaine
#                        en expéditeur ; c'est ce qui définit la surface
#                        d'usurpation légitime à surveiller.
#
# Correspondances insensibles à la casse. Les suffixes MX correspondent sur
# une frontière de label (« l.google.com » ne matche pas « notgoogle.com »).

version: 1

providers:
  # ---------------------------------------------------------------------
  # Boîtes aux lettres
  # ---------------------------------------------------------------------
  - name: Google Workspace
    kind: mailbox
    can_send_as_domain: true
    mx: [aspmx.l.google.com, googlemail.com, aspmx2.googlemail.com, smtp.google.com]
    spf_includes: [_spf.google.com, _netblocks.google.com, aspmx.googlemail.com]
    dkim_prefix: [google]
    txt_tokens: ["google-site-verification="]

  - name: Microsoft 365
    kind: mailbox
    can_send_as_domain: true
    mx: [mail.protection.outlook.com, mail.eo.outlook.com]
    spf_includes: [spf.protection.outlook.com, spf.messaging.microsoft.com]
    dkim_prefix: [selector1, selector2]
    txt_tokens: ["MS=", "ms-domain-verification="]

  - name: OVHcloud
    kind: mailbox
    can_send_as_domain: true
    mx: [mail.ovh.net, mx0.mail.ovh.net, mx1.mail.ovh.net, mx2.mail.ovh.net, mx3.mail.ovh.net, ovh.net]
    spf_includes: [mx.ovh.com, spf.mail.ovh.net]
    dkim_prefix: [ovhmo]
    txt_tokens: ["ovh-domain-verification="]

  - name: Proton Mail
    kind: mailbox
    can_send_as_domain: true
