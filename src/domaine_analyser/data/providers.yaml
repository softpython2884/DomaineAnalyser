    dkim_prefix: [protonmail]
    txt_tokens: ["protonmail-verification="]

  - name: Zoho Mail
    kind: mailbox
    can_send_as_domain: true
    mx: [zoho.com, zoho.eu, mx.zoho.com, mx2.zoho.com, mx3.zoho.com, zohomail.com]
    spf_includes: [zoho.com, zoho.eu, zohomail.com]
    dkim_prefix: [zoho, zmail]
    txt_tokens: ["zoho-verification=", "zoho-domain-verification="]

  - name: Infomaniak
    kind: mailbox
    can_send_as_domain: true
    mx: [infomaniak.ch, mail.infomaniak.ch]
    spf_includes: [spf.infomaniak.ch]
